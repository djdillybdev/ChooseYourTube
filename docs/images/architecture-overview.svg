<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">ChooseYourTube deployment architecture</title>
  <desc id="description">A browser connects either to the complete Docker deployment with SvelteKit, FastAPI, PostgreSQL, Redis and an arq worker, or to the hosted Vercel demo with SvelteKit, a FastAPI function and Neon PostgreSQL. The complete deployment uses YouTube RSS and the Data API; the demo uses RSS only.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#f5f3ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <style>
      .heading { font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subheading { font: 600 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .detail { font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; text-anchor: middle; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; filter: url(#shadow); }
      .primary { fill: #ede9fe; stroke: #7c3aed; }
      .data { fill: #ecfeff; stroke: #0891b2; }
      .queue { fill: #fff7ed; stroke: #ea580c; }
      .external { fill: #f8fafc; stroke: #64748b; stroke-dasharray: 7 5; }
      .flow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#background)" />
  <text x="700" y="54" class="heading" text-anchor="middle">One product, two deployment profiles</text>

  <rect x="555" y="82" width="290" height="74" rx="18" class="node primary" />
  <text x="700" y="115" class="label">Browser</text>
  <text x="700" y="139" class="detail">HTTP-only session cookies</text>

  <path d="M 650 156 C 600 190, 470 184, 410 220" class="branch" />
  <path d="M 750 156 C 800 190, 930 184, 990 220" class="branch" />

  <rect x="50" y="215" width="630" height="495" rx="24" class="panel" />
  <text x="365" y="254" class="subheading" text-anchor="middle">Full self-hosted application</text>
  <text x="365" y="280" class="detail">Docker Compose · complete feature set</text>

  <rect x="95" y="315" width="220" height="72" rx="16" class="node primary" />
  <text x="205" y="346" class="label">SvelteKit</text>
  <text x="205" y="370" class="detail">UI and API proxy</text>
  <rect x="405" y="315" width="220" height="72" rx="16" class="node primary" />
  <text x="515" y="346" class="label">FastAPI</text>
  <text x="515" y="370" class="detail">owner-scoped API</text>
  <path d="M 315 351 L 405 351" class="flow" />

  <rect x="405" y="435" width="220" height="72" rx="16" class="node data" />
  <text x="515" y="466" class="label">PostgreSQL</text>
  <text x="515" y="490" class="detail">data and durable job state</text>
  <path d="M 515 387 L 515 435" class="flow" />

  <rect x="95" y="435" width="190" height="72" rx="16" class="node queue" />
  <text x="190" y="466" class="label">Redis</text>
  <text x="190" y="490" class="detail">job transport</text>
  <path d="M 405 367 C 350 400, 315 432, 285 454" class="flow" />
  <rect x="95" y="555" width="190" height="72" rx="16" class="node queue" />
  <text x="190" y="586" class="label">arq worker</text>
  <text x="190" y="610" class="detail">hourly sync and retries</text>
  <path d="M 190 507 L 190 555" class="flow" />
  <path d="M 285 591 C 345 570, 390 525, 425 497" class="flow" />

  <rect x="405" y="555" width="220" height="72" rx="16" class="node external" />
  <text x="515" y="586" class="label">YouTube</text>
  <text x="515" y="610" class="detail">RSS first · Data API enrichment</text>
  <path d="M 285 607 L 405 607" class="flow" />

  <rect x="720" y="215" width="630" height="495" rx="24" class="panel" />
  <text x="1035" y="254" class="subheading" text-anchor="middle">Hosted portfolio demo</text>
  <text x="1035" y="280" class="detail">Vercel + Neon · quota-safe shared experience</text>

  <rect x="765" y="315" width="220" height="72" rx="16" class="node primary" />
  <text x="875" y="346" class="label">SvelteKit</text>
  <text x="875" y="370" class="detail">Vercel web function</text>
  <rect x="1075" y="315" width="220" height="72" rx="16" class="node primary" />
  <text x="1185" y="346" class="label">FastAPI</text>
  <text x="1185" y="370" class="detail">Vercel API function</text>
  <path d="M 985 351 L 1075 351" class="flow" />

  <rect x="1075" y="435" width="220" height="72" rx="16" class="node data" />
  <text x="1185" y="466" class="label">Neon PostgreSQL</text>
  <text x="1185" y="490" class="detail">shared seeded demo data</text>
  <path d="M 1185 387 L 1185 435" class="flow" />

  <rect x="765" y="435" width="220" height="72" rx="16" class="node queue" />
  <text x="875" y="466" class="label">Daily cron</text>
  <text x="875" y="490" class="detail">reset and maintenance</text>
  <path d="M 985 471 L 1075 383" class="flow" />

  <rect x="1075" y="555" width="220" height="72" rx="16" class="node external" />
  <text x="1185" y="586" class="label">YouTube RSS</text>
  <text x="1185" y="610" class="detail">no API key or persistent worker</text>
  <path d="M 1260 387 C 1335 435, 1335 535, 1295 575" class="flow" />

  <text x="700" y="744" class="detail">Shared services, models, migrations and UI · runtime policy controls the differences</text>
</svg>
