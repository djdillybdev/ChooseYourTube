name: Release containers

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  images:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/djdillybdev/chooseyourtube-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true
      - run: echo '${{ steps.build.outputs.digest }}  chooseyourtube-${{ matrix.component }}' > image-digest-${{ matrix.component }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.component }}
          path: image-digest-${{ matrix.component }}.txt

  github-release:
    name: Create draft GitHub release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
      - run: sha256sum image-digest-*.txt > checksums.txt
      - name: Create curated draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create '${{ github.ref_name }}'
          --draft
          --title 'ChooseYourTube ${{ github.ref_name }}'
          --notes-file docs/releases/v1.0.0.md
          image-digest-*.txt
          checksums.txt
          docs/releases/chooseyourtube-demo-v1.0.0.vtt
          docs/releases/chooseyourtube-demo-v1.0.0-transcript.md
