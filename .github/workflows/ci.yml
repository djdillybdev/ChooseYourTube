name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chooseyourtube_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d chooseyourtube_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/chooseyourtube_test
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/chooseyourtube_test
      REDIS_URL: redis://127.0.0.1:6379/0
      API_ORIGIN: http://127.0.0.1:5173
      YOUTUBE_API_KEY: ci-fixture-key
      AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-characters
      ENABLE_STARTUP_SCHEMA_CHECK: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - run: uv run mypy app
      - run: uv run pytest
      - run: uv run python scripts/check_coverage.py
      - run: uv run alembic check

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm run docs:check
      - run: pnpm exec eslint .
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run build:vercel
      - run: pnpm run test:coverage

  schema:
    name: OpenAPI schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run api:check
        working-directory: frontend

  ansible:
    name: Ansible deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/ansible
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/ansible/requirements.txt
      - run: pip install -r requirements.txt
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-lint
      - name: Validate inventory and playbook syntax
        run: |
          ansible-inventory -i inventory/ci/hosts.yml --list >/dev/null
          for playbook in playbooks/*.yml; do
            ansible-playbook -i inventory/ci/hosts.yml --syntax-check "$playbook"
          done
      - name: Validate the variable contract
        run: ansible-playbook -i inventory/ci/hosts.yml playbooks/validate.yml
      - name: Run Ansible contract tests
        run: |
          for test_playbook in tests/*.yml; do
            ansible-playbook -i inventory/ci/hosts.yml "$test_playbook"
          done

  e2e:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright artifacts
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Production containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create isolated smoke environment
        run: |
          cp .env.example .env
          echo 'YOUTUBE_API_KEY=ci-fixture-key' >> .env
          echo 'AUTH_SECRET=ci-auth-secret-with-at-least-thirty-two-characters' >> .env
          echo 'REGISTRATION_EMAIL_ALLOWLIST=compose-smoke@example.com' >> .env
      - run: docker compose --env-file .env config --quiet
      - run: docker compose --env-file .env -f compose.yaml -f compose.release.yaml config --quiet
      - name: Validate deployment shell scripts
        run: |
          shellcheck -e SC1091,SC2016 deploy/oracle/bin/*.sh scripts/backup.sh scripts/restore.sh
          for file in deploy/oracle/bin/*.sh scripts/backup.sh scripts/restore.sh; do
            sh -n "$file"
          done
      - run: python3 scripts/check_oracle_compose.py
      - name: Validate Oracle Caddy configuration
        run: >-
          APP_DOMAIN=tube.example.com ACME_EMAIL=admin@example.com
          docker compose --env-file .env
          -f compose.yaml -f compose.release.yaml -f deploy/oracle/compose.yaml
          run --rm --no-deps caddy caddy validate
          --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker compose --env-file .env build backend worker frontend migrate
      - run: docker compose --env-file .env up -d postgres redis migrate backend worker frontend
      - run: python3 scripts/compose_smoke.py
        env:
          SMOKE_DISALLOWED_EMAIL: blocked@example.com
      - name: Capture Compose diagnostics
        if: failure()
        run: docker compose --env-file .env ps && docker compose --env-file .env logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose --env-file .env down --volumes
