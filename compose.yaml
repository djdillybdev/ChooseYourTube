services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chooseyourtube
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_MODE: ${APP_MODE:-full}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/chooseyourtube
      REDIS_URL: redis://redis:6379/0
      API_ORIGIN: ${API_ORIGIN:-http://localhost:5173}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/chooseyourtube
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_MODE: ${APP_MODE:-full}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-true}
      YOUTUBE_OAUTH_ENABLED: ${YOUTUBE_OAUTH_ENABLED:-false}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
      YOUTUBE_DAILY_QUOTA_BUDGET: ${YOUTUBE_DAILY_QUOTA_BUDGET:-8000}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_MAINTENANCE_SECRET: ${DEMO_MAINTENANCE_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ALLOW_INSECURE_OAUTH_TRANSPORT: ${ALLOW_INSECURE_OAUTH_TRANSPORT:-false}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/chooseyourtube
      REDIS_URL: redis://redis:6379/0
      API_ORIGIN: ${API_ORIGIN:-http://localhost:5173}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      echo_sql: ${ECHO_SQL:-false}
      debug_logs: ${DEBUG_LOGS:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    ports:
      - "8000:8000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      [
        "gunicorn",
        "app.main:app",
        "-k",
        "uvicorn.workers.UvicornWorker",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "${WEB_CONCURRENCY:-2}",
        "--timeout",
        "${GUNICORN_TIMEOUT:-60}",
        "--no-control-socket",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_MODE: ${APP_MODE:-full}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-true}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/chooseyourtube
      REDIS_URL: redis://redis:6379/0
      API_ORIGIN: ${API_ORIGIN:-http://localhost:5173}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      echo_sql: ${ECHO_SQL:-false}
      debug_logs: ${DEBUG_LOGS:-false}
    command: ["arq", "app.worker.WorkerSettings"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from redis import Redis; import os,sys; sys.exit(0 if Redis.from_url(os.environ['REDIS_URL']).exists('chooseyourtube:worker:heartbeat') else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      ORIGIN: ${API_ORIGIN:-http://localhost:5173}
      API_BASE_URL: http://backend:8000
      VITE_API_BASE_URL: http://backend:8000
    ports:
      - "5173:5173"
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/api/meta').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8

  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_MODE: ${APP_MODE:-full}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/chooseyourtube
      REDIS_URL: redis://redis:6379/0
      API_ORIGIN: ${API_ORIGIN:-http://localhost:5173}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      YOUTUBE_OAUTH_ENABLED: ${YOUTUBE_OAUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ALLOW_INSECURE_OAUTH_TRANSPORT: ${ALLOW_INSECURE_OAUTH_TRANSPORT:-false}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      echo_sql: ${ECHO_SQL:-false}
      debug_logs: ${DEBUG_LOGS:-true}
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_MODE: ${APP_MODE:-full}
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/chooseyourtube
      REDIS_URL: redis://redis:6379/0
      API_ORIGIN: ${API_ORIGIN:-http://localhost:5173}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      echo_sql: ${ECHO_SQL:-false}
      debug_logs: ${DEBUG_LOGS:-true}
    volumes:
      - ./backend:/app
    command: ["arq", "app.worker.WorkerSettings"]

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    depends_on:
      backend-dev:
        condition: service_healthy
    environment:
      CI: "true"
      API_BASE_URL: http://backend-dev:8000
      VITE_API_BASE_URL: http://backend-dev:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm/store
    ports:
      - "5174:5173"
    command:
      [
        "sh",
        "-c",
        "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 5173",
      ]

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_pnpm_store:
