x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
    max-file: ${CONTAINER_LOG_MAX_FILES:-5}

services:
  postgres:
    cpus: ${POSTGRES_CPUS:-0.75}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    logging: *bounded-logging

  redis:
    cpus: ${REDIS_CPUS:-0.25}
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    logging: *bounded-logging

  migrate:
    environment:
      APP_ENV: production
      APP_MODE: full
      API_ORIGIN: https://${APP_DOMAIN}
    cpus: ${MIGRATE_CPUS:-1.0}
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-768m}
    logging: *bounded-logging

  backend:
    cpus: ${BACKEND_CPUS:-0.75}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    ports: !override []
    environment:
      APP_ENV: production
      APP_MODE: full
      REGISTRATION_ENABLED: "true"
      REGISTRATION_ALLOWLIST_REQUIRED: "true"
      API_ORIGIN: https://${APP_DOMAIN}
      API_CORS_ORIGINS: https://${APP_DOMAIN}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    logging: *bounded-logging

  worker:
    cpus: ${WORKER_CPUS:-1.0}
    mem_limit: ${WORKER_MEMORY_LIMIT:-768m}
    logging: *bounded-logging
    environment:
      APP_ENV: production
      APP_MODE: full
      API_ORIGIN: https://${APP_DOMAIN}

  frontend:
    cpus: ${FRONTEND_CPUS:-0.50}
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-384m}
    ports: !override []
    environment:
      ORIGIN: https://${APP_DOMAIN}
    logging: *bounded-logging

  caddy:
    image: caddy:2.11.4-alpine
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cpus: ${CADDY_CPUS:-0.25}
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}
    logging: *bounded-logging

volumes:
  caddy_data:
  caddy_config:
