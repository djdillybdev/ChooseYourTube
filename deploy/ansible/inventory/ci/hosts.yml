---
all:
  children:
    chooseyourtube:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
      vars:
        chooseyourtube_version: "1.0.0"
        chooseyourtube_domain: "tube.example.test"
        chooseyourtube_acme_email: "admin@example.test"
        chooseyourtube_registration_enabled: true
        chooseyourtube_registration_allowlist:
          - "invited@example.test"
        chooseyourtube_youtube_api_key: "ci-youtube-key"
        chooseyourtube_auth_secret: "ci-auth-secret-with-at-least-thirty-two-characters"
        chooseyourtube_postgres_password: "ci-postgres-password-with-24-chars"
        chooseyourtube_manage_ufw: false
