---
- name: Reject enabled registration without an allowlist
  hosts: chooseyourtube
  become: false
  gather_facts: false
  vars:
    chooseyourtube_registration_enabled: true
    chooseyourtube_registration_allowlist: []
  tasks:
    - name: Initialize the rejection result
      ansible.builtin.set_fact:
        chooseyourtube_open_registration_rejected: false

    - name: Exercise allowlist-only validation
      block:
        - name: Validate deliberately unsafe registration variables
          ansible.builtin.include_role:
            name: chooseyourtube
            tasks_from: validate.yml
      rescue:
        - name: Record the expected validation rejection
          ansible.builtin.set_fact:
            chooseyourtube_open_registration_rejected: true

    - name: Require open registration to be rejected
      ansible.builtin.assert:
        that:
          - chooseyourtube_open_registration_rejected
        fail_msg: "Allowlist-only validation accepted open registration."
        quiet: true
