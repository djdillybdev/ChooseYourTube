---
- name: Create and fetch a ChooseYourTube backup
  hosts: chooseyourtube
  become: true
  gather_facts: false
  serial: 1
  vars:
    chooseyourtube_effective_project_dir: "{{ chooseyourtube_project_dir | default('/opt/chooseyourtube') }}"
    chooseyourtube_effective_controller_backup_dir: >-
      {{
        chooseyourtube_controller_backup_dir
        | default(playbook_dir ~ '/../backups/' ~ inventory_hostname)
      }}
  tasks:
    - name: Create a fresh PostgreSQL backup
      ansible.builtin.command:
        argv:
          - "{{ chooseyourtube_effective_project_dir }}/deploy/oracle/bin/backup.sh"
      environment:
        ENV_FILE: "{{ chooseyourtube_effective_project_dir }}/.env"
      register: chooseyourtube_backup_result
      changed_when: true

    - name: Resolve the remote backup path
      ansible.builtin.set_fact:
        chooseyourtube_remote_backup_path: >-
          {{
            chooseyourtube_backup_result.stdout
            | regex_search('/[^\n]+\.dump')
            | default('', true)
          }}

    - name: Require a reported backup path
      ansible.builtin.assert:
        that:
          - chooseyourtube_remote_backup_path | length > 0
        fail_msg: "The backup command did not report a PostgreSQL dump path."

    - name: Inspect the completed backup
      ansible.builtin.stat:
        path: "{{ chooseyourtube_remote_backup_path }}"
        checksum_algorithm: sha256
      register: chooseyourtube_remote_backup

    - name: Require a non-empty completed backup
      ansible.builtin.assert:
        that:
          - chooseyourtube_remote_backup.stat.isreg | default(false)
          - chooseyourtube_remote_backup.stat.size | int > 0
          - chooseyourtube_remote_backup.stat.checksum | length == 64
        fail_msg: "The remote PostgreSQL backup is missing, empty, or unverifiable."

    - name: Create the controller backup directory
      ansible.builtin.file:
        path: "{{ chooseyourtube_effective_controller_backup_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch the verified database backup
      ansible.builtin.fetch:
        src: "{{ chooseyourtube_remote_backup_path }}"
        dest: "{{ chooseyourtube_effective_controller_backup_dir }}/"
        flat: true
        validate_checksum: true
      register: chooseyourtube_fetched_backup

    - name: Protect the fetched backup
      ansible.builtin.file:
        path: "{{ chooseyourtube_fetched_backup.dest }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Inspect the fetched backup
      ansible.builtin.stat:
        path: "{{ chooseyourtube_fetched_backup.dest }}"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: chooseyourtube_local_backup

    - name: Verify the fetched backup checksum
      ansible.builtin.assert:
        that:
          - chooseyourtube_local_backup.stat.checksum == chooseyourtube_remote_backup.stat.checksum
        fail_msg: "The fetched backup checksum does not match the remote dump."

    - name: Write the backup checksum manifest
      ansible.builtin.copy:
        content: "{{ chooseyourtube_remote_backup.stat.checksum }}  {{ chooseyourtube_fetched_backup.dest | basename }}\n"
        dest: "{{ chooseyourtube_fetched_backup.dest }}.sha256"
        mode: "0600"
      delegate_to: localhost
      become: false
