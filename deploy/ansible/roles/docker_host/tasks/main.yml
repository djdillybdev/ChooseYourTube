---
- name: Require the supported host operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version == "24.04"
      - ansible_facts.architecture in ["x86_64", "aarch64"]
    fail_msg: "ChooseYourTube Ansible deployment supports Ubuntu 24.04 on x86_64 or aarch64."

- name: Remove packages that conflict with Docker Engine
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent
    purge: false

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker's repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Inspect Docker's Deb822 repository
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/docker.sources
  register: chooseyourtube_existing_docker_repository

- name: Configure Docker's Deb822 repository
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts.distribution_release }}
      Components: stable
      Architectures: {{ 'amd64' if ansible_facts.architecture == 'x86_64' else 'arm64' }}
      Signed-By: /etc/apt/keyrings/docker.asc
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  register: chooseyourtube_docker_repository

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: "{{ chooseyourtube_docker_packages }}"
    state: present
    update_cache: "{{ chooseyourtube_docker_repository.changed }}"
  notify: Restart Docker
  when: not ansible_check_mode or chooseyourtube_existing_docker_repository.stat.exists

- name: Enable Docker Engine
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Apply Docker service changes before application deployment
  ansible.builtin.meta: flush_handlers
