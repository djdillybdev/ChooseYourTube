---
- name: Validate the ChooseYourTube deployment contract
  ansible.builtin.assert:
    that:
      - chooseyourtube_version is match('^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$')
      - chooseyourtube_project_dir == '/opt/chooseyourtube'
      - chooseyourtube_caddy_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - chooseyourtube_domain is match('^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$')
      - chooseyourtube_domain != 'tube.example.com'
      - chooseyourtube_acme_email is match('^[^@\s]+@[^@\s]+\.[^@\s]+$')
      - chooseyourtube_acme_email != 'admin@example.com'
      - chooseyourtube_youtube_api_key is match('^[A-Za-z0-9_-]+$')
      - chooseyourtube_youtube_api_key != 'replace-me'
      - chooseyourtube_auth_secret is match('^[A-Za-z0-9_-]{32,}$')
      - chooseyourtube_auth_secret != 'replace-with-openssl-rand-hex-32'
      - chooseyourtube_postgres_password is match('^[A-Za-z0-9_-]{24,}$')
      - chooseyourtube_postgres_password != 'replace-with-openssl-rand-hex-24'
      - chooseyourtube_postgres_user is match('^[A-Za-z_][A-Za-z0-9_-]*$')
      - chooseyourtube_postgres_database is match('^[A-Za-z_][A-Za-z0-9_-]*$')
      - not chooseyourtube_registration_enabled or chooseyourtube_registration_allowlist | length > 0
      - not chooseyourtube_youtube_oauth_enabled or chooseyourtube_google_client_id | length > 0
      - not chooseyourtube_youtube_oauth_enabled or chooseyourtube_google_client_secret | length > 0
      - not chooseyourtube_youtube_oauth_enabled or chooseyourtube_google_redirect_uri | length > 0
      - not chooseyourtube_youtube_oauth_enabled or chooseyourtube_google_client_id is match('^[A-Za-z0-9._-]+$')
      - not chooseyourtube_youtube_oauth_enabled or chooseyourtube_google_client_secret is match('^[A-Za-z0-9._-]+$')
      - not chooseyourtube_youtube_oauth_enabled or chooseyourtube_google_redirect_uri == 'https://' ~ chooseyourtube_domain ~ '/imports/youtube/oauth/callback'
      - (chooseyourtube_registry_username | length == 0) == (chooseyourtube_registry_token | length == 0)
      - chooseyourtube_registry_username | length == 0 or chooseyourtube_registry_username is match('^[A-Za-z0-9._-]+$')
      - chooseyourtube_registry_token | length == 0 or chooseyourtube_registry_token is match('^[A-Za-z0-9._=-]+$')
      - chooseyourtube_backup_dir is match('^/[^/].*')
      - chooseyourtube_backup_retention_days | int > 0
      - chooseyourtube_ssh_port | int >= 1
      - chooseyourtube_ssh_port | int <= 65535
      - not chooseyourtube_manage_ufw or chooseyourtube_admin_cidrs | length > 0
    fail_msg: "ChooseYourTube deployment variables are incomplete or unsafe."
    quiet: true

- name: Validate registration allowlist addresses
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,63}$')
      - item != 'person@example.com'
    fail_msg: "Invalid registration allowlist address: {{ item }}"
    quiet: true
  loop: "{{ chooseyourtube_registration_allowlist }}"

- name: Validate administrator CIDRs
  ansible.builtin.assert:
    that:
      - item is match('^[0-9A-Fa-f:.]+/[0-9]{1,3}$')
    fail_msg: "Invalid administrator network: {{ item }}"
    quiet: true
  loop: "{{ chooseyourtube_admin_cidrs }}"
  when: chooseyourtube_manage_ufw | bool

- name: Parse administrator CIDRs with Python
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - -c
      - "import ipaddress, sys; ipaddress.ip_network(sys.argv[1], strict=False)"
      - "{{ item }}"
  loop: "{{ chooseyourtube_admin_cidrs }}"
  changed_when: false
  when: chooseyourtube_manage_ufw | bool
