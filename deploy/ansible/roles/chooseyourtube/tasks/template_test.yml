---
- name: Create a temporary environment render directory
  ansible.builtin.tempfile:
    state: directory
    prefix: chooseyourtube-ansible-
  register: chooseyourtube_template_test_directory

- name: Validate the production environment template
  block:
    - name: Render a fixture production environment
      ansible.builtin.template:
        src: oracle.env.j2
        dest: "{{ chooseyourtube_template_test_directory.path }}/.env"
        mode: "0600"
      no_log: true
      diff: false

    - name: Inspect the rendered fixture permissions
      ansible.builtin.stat:
        path: "{{ chooseyourtube_template_test_directory.path }}/.env"
      register: chooseyourtube_template_test_stat

    - name: Read the rendered fixture
      ansible.builtin.slurp:
        path: "{{ chooseyourtube_template_test_directory.path }}/.env"
      register: chooseyourtube_template_test_content
      no_log: true

    - name: Assert the rendered fixture contract
      ansible.builtin.assert:
        that:
          - chooseyourtube_template_test_stat.stat.mode == '0600'
          - "'APP_ENV=production' in (chooseyourtube_template_test_content.content | b64decode)"
          - "'REGISTRATION_ALLOWLIST_REQUIRED=true' in (chooseyourtube_template_test_content.content | b64decode)"
          - "'invited@example.test' in (chooseyourtube_template_test_content.content | b64decode)"
        quiet: true
  always:
    - name: Remove the temporary environment render directory
      ansible.builtin.file:
        path: "{{ chooseyourtube_template_test_directory.path }}"
        state: absent
