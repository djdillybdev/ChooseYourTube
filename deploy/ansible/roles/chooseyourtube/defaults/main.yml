---
chooseyourtube_repository_url: https://github.com/djdillybdev/ChooseYourTube.git
chooseyourtube_project_dir: /opt/chooseyourtube
chooseyourtube_version: "1.0.0"
chooseyourtube_caddy_version: "2.11.4"
chooseyourtube_domain: "tube.example.com"
chooseyourtube_acme_email: "admin@example.com"

chooseyourtube_registration_enabled: true
chooseyourtube_registration_allowlist: []
chooseyourtube_youtube_daily_quota_budget: 8000
chooseyourtube_youtube_oauth_enabled: false
chooseyourtube_google_client_id: ""
chooseyourtube_google_client_secret: ""
chooseyourtube_google_redirect_uri: ""
chooseyourtube_registry_username: ""
chooseyourtube_registry_token: ""
chooseyourtube_manage_ufw: false
chooseyourtube_admin_cidrs: []
chooseyourtube_ssh_port: 22

chooseyourtube_postgres_user: chooseyourtube
chooseyourtube_postgres_database: chooseyourtube
chooseyourtube_backup_dir: /var/backups/chooseyourtube
chooseyourtube_backup_retention_days: 14
chooseyourtube_allow_low_resource: false

chooseyourtube_web_concurrency: 1
chooseyourtube_gunicorn_timeout: 60
chooseyourtube_caddy_cpus: "0.25"
chooseyourtube_caddy_memory_limit: 128m
chooseyourtube_frontend_cpus: "0.50"
chooseyourtube_frontend_memory_limit: 384m
chooseyourtube_backend_cpus: "0.75"
chooseyourtube_backend_memory_limit: 768m
chooseyourtube_worker_cpus: "1.0"
chooseyourtube_worker_memory_limit: 768m
chooseyourtube_postgres_cpus: "0.75"
chooseyourtube_postgres_memory_limit: 1g
chooseyourtube_redis_cpus: "0.25"
chooseyourtube_redis_memory_limit: 256m
chooseyourtube_migrate_cpus: "1.0"
chooseyourtube_migrate_memory_limit: 768m
chooseyourtube_container_log_max_size: 10m
chooseyourtube_container_log_max_files: 5
