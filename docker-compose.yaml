services:
  db:
    image: postgres:16-alpine
    container_name: yt_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yt
    ports: ["5432:5432"]
    volumes: [db_data:/var/lib/postgresql/data]
    restart: always

  redis:
    image: redis:7-alpine
    container_name: yt_redis
    ports: ["6379:6379"]
    restart: always

  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: yt_api
    working_dir: /app/backend
    volumes:
      - ./:/app
      - /app/backend/.venv
    env_file: ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/yt
      REDIS_URL: redis://redis:6379/0
      API_ORIGIN: http://localhost:5173
    depends_on: [db, redis]
    ports: ["8009:8009"]
    command: ["uv","run","uvicorn","app.main:app","--host","0.0.0.0","--port","8009","--reload"]
    restart: unless-stopped

  worker:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: yt_worker
    working_dir: /app/backend
    volumes:
      - ./:/app
      - /app/backend/.venv
    env_file: ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/yt
      REDIS_URL: redis://redis:6379/0
      API_ORIGIN: http://localhost:5173 
    depends_on: [db, redis]
    command: ["uv","run","arq","app.worker.WorkerSettings"]
    restart: unless-stopped

volumes:
  db_data:
